<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT e-coupon 作者統計</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="js/style.css">
</head>
<body>
<div class="container">

    <div class="header">
        <h1>📊 PTT e-coupon 作者統計</h1>
        <p id="info" class="info-bar">載入中…</p>
    </div>

    <!-- ⚠️ 3 小時內連續發文警示 -->
    <div id="rapid" class="card card-rapid" style="display:none;">
        <div class="card-title"><span class="icon">⚠️</span> 3 小時內連續發文</div>
        <div id="rapid-content"></div>
    </div>

    <!-- 📅 每日發文日曆（可收合） -->
    <div class="card card-calendar">
        <div class="card-title">
            <span class="icon">📅</span> 每日發文統計
            <button class="toggle-btn toggle-calendar" id="toggle-calendar" aria-expanded="true">
                <span id="calendar-toggle-label">收合</span>
                <span class="arrow" id="calendar-toggle-arrow">▼</span>
            </button>
        </div>
        <div class="calendar-content-wrapper" id="calendar-wrapper">
            <div id="calendar-content"></div>
        </div>
    </div>

    <!-- 工具列 -->
    <div class="toolbar" id="toolbar" style="display:none;">
        <button class="btn btn-primary" id="export-csv">⬇ 匯出 CSV</button>
        <button class="btn btn-secondary" id="export-xls">⬇ 匯出 XLS</button>
    </div>

    <!-- 統計表格 -->
    <div class="table-wrapper">
        <table id="stats-table" style="display:none;">
            <thead>
                <tr><th>作者</th><th>篇數</th><th>文章 ID</th></tr>
            </thead>
            <tbody id="stats-body"></tbody>
        </table>
    </div>
    <div id="empty-message" class="empty-state" style="display:none;">目前尚無資料</div>

</div>

<script src="js/main.js"></script>
</body>
</html>
