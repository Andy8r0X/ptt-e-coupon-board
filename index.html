<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT e-coupon 本週作者統計</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 700px; margin: auto; }
        h1 { text-align: center; }
        .toolbar { text-align: center; margin: 10px 0; }
        .toolbar button {
            margin: 0 5px; padding: 8px 16px; cursor: pointer;
            background: #4CAF50; color: white; border: none; border-radius: 4px;
            font-size: 14px;
        }
        .toolbar button:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; vertical-align: top; }
        th { background-color: #f2f2f2; }
        .info { color: #666; font-size: 0.9em; text-align: center; }
        .article-list { font-size: 0.8em; color: #555; margin-top: 5px; padding-left: 15px; }
        .article-list span { display: block; }
        .deleted-badge { color: #c00; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PTT e-coupon 板本週作者發文統計</h1>
        <div id="info" class="info">載入中...</div>
        <div class="toolbar" id="toolbar" style="display:none;">
            <button id="export-csv">匯出 CSV</button>
            <button id="export-xls">匯出 XLS</button>
        </div>
        <table id="stats-table" style="display:none;">
            <thead>
                <tr><th>作者</th><th>篇數</th><th>文章 ID</th></tr>
            </thead>
            <tbody id="stats-body"></tbody>
        </table>
    </div>
    <script>
        let statsData = null;

        fetch('stats.json')
            .then(res => res.json())
            .then(data => {
                statsData = data;
                const info = document.getElementById('info');
                const table = document.getElementById('stats-table');
                const tbody = document.getElementById('stats-body');
                const toolbar = document.getElementById('toolbar');

                info.textContent = `統計區間：${data.dateRange.start} ~ ${data.dateRange.end} | 掃描頁數：${data.scannedPages} | 更新時間：${new Date(data.generatedAt).toLocaleString()}`;
                
                const entries = Object.entries(data.stats).sort((a, b) => a[0].localeCompare(b[0]));
                if (entries.length === 0) {
                    info.textContent += '（無資料）';
                } else {
                    table.style.display = 'table';
                    toolbar.style.display = 'block';
                    for (const [author, infoObj] of entries) {
                        const row = document.createElement('tr');
                        const idList = infoObj.articleIds.map(id => `<span>${id}</span>`).join('');
                        let countDisplay = `${infoObj.count}篇`;
                        if (infoObj.deletedCount > 0) {
                            countDisplay += ` <span class="deleted-badge">(刪除${infoObj.deletedCount}篇)</span>`;
                        }
                        row.innerHTML = `<td>${author}</td><td>${countDisplay}</td><td class="article-list">${idList}</td>`;
                        tbody.appendChild(row);
                    }
                }
            })
            .catch(err => {
                document.getElementById('info').textContent = '載入失敗：' + err.message;
            });

        document.getElementById('export-csv').addEventListener('click', () => {
            if (!statsData) return;
            const rows = [['作者', '總篇數', '正常篇數', '刪除篇數', '文章ID']];
            for (const [author, infoObj] of Object.entries(statsData.stats).sort((a, b) => a[0].localeCompare(b[0]))) {
                rows.push([author, infoObj.count, infoObj.normalCount, infoObj.deletedCount, infoObj.articleIds.join(' ')]);
            }
            const csvContent = rows.map(row => row.join(',')).join('\n');
            downloadFile(csvContent, 'ecoupon_stats.csv', 'text/csv;charset=utf-8;');
        });

        document.getElementById('export-xls').addEventListener('click', () => {
            if (!statsData) return;
            let html = '<table border="1"><tr><th>作者</th><th>總篇數</th><th>正常篇數</th><th>刪除篇數</th><th>文章ID</th></tr>';
            for (const [author, infoObj] of Object.entries(statsData.stats).sort((a, b) => a[0].localeCompare(b[0]))) {
                html += `<tr><td>${author}</td><td>${infoObj.count}</td><td>${infoObj.normalCount}</td><td>${infoObj.deletedCount}</td><td>${infoObj.articleIds.join('<br>')}</td></tr>`;
            }
            html += '</table>';
            const blob = new Blob([html], { type: 'application/vnd.ms-excel' });
            downloadBlob(blob, 'ecoupon_stats.xls');
        });

        function downloadFile(content, filename, mime) {
            const blob = new Blob([content], { type: mime });
            downloadBlob(blob, filename);
        }

        function downloadBlob(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>
