<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT e-coupon 作者統計</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- 外部 CSS -->
    <link rel="stylesheet" href="js/style.css">
</head>
<body>
<div class="container">

    <div class="header">
        <h1>📊 PTT e-coupon 作者統計</h1>
        <p id="info" class="info-bar">載入中…</p>
    </div>

    <!-- 公告卡片（可折疊） -->
    <div class="card card-announcement" id="announcement-card">
        <div class="card-title">
            <span class="icon">📢</span>
            公告計點名單（手動更新）
            <span class="count-badge-ann" id="announcement-count">0 人</span>
            <button class="toggle-btn" id="toggle-announcement" aria-expanded="false">
                <span id="toggle-label">展開</span>
                <span class="arrow" id="toggle-arrow">▼</span>
            </button>
        </div>
        <div class="announcement-content" id="announcement-content">
            載入中…
        </div>
    </div>

    <!-- 高亮卡片 -->
    <div id="highlight" class="card card-highlight" style="display:none;">
        <div class="card-title"><span class="icon">🔥</span> 7天內超過1篇的作者（僅供當日參考 未包含已刪文）</div>
        <div id="highlight-content"></div>
    </div>

    <div class="toolbar" id="toolbar" style="display:none;">
        <button class="btn btn-primary" id="export-csv">⬇ 匯出 CSV</button>
        <button class="btn btn-secondary" id="export-xls">⬇ 匯出 XLS</button>
    </div>

    <div class="table-wrapper">
        <table id="stats-table" style="display:none;">
            <thead>
                <tr><th>作者</th><th>篇數</th><th>文章 ID</th></tr>
            </thead>
            <tbody id="stats-body"></tbody>
        </table>
    </div>
    <div id="empty-message" class="empty-state" style="display:none;">目前尚無資料</div>

</div>

<script src="js/main.js"></script>
</body>
</html>
