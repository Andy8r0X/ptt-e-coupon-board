name: Update PTT Stats
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ⚠️ 此步驟僅用於本次重置，執行完畢後請移除或註解掉
      - name: 重置狀態（一次性）
        run: rm -f state.json   # 僅刪除狀態檔，保留 stats.json（或也可刪除 stats.json，視需求而定）

      - name: Run fetch script
        run: node fetch_stats.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.json export/
          git diff --cached --quiet || git commit -m "Update stats.json and export files"
          git push
