name: Update PTT Stats
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run fetch script
        run: |
              rm -f state.json stats.json   # 刪除舊的狀態與統計檔
              node fetch_stats.js           # 重新執行抓取        

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.json export/ state.json   # <--- 加入 state.json
          git diff --cached --quiet || git commit -m "Update stats.json and export files"
          git push
